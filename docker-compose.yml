services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: lm-smart-postgres
    restart: unless-stopped
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lmsmart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lmsmart}
      POSTGRES_DB: ${POSTGRES_DB:-lmsmart}
    volumes:
      - lm_smart_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lmsmart -d lmsmart"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  lm_smart_pgdata:
